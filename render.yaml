services:
  # Backend API Service
  - type: web
    name: leonoxantigravity-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./smartwms.db
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"

  # Frontend Static Site
  - type: static
    name: leonoxantigravity
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: leonoxantigravity-api
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
